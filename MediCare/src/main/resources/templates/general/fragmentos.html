<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!--FRAGMENTO HEAD -->
    <head th:fragment="head">
        <title>MediCare</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
        <link rel="stylesheet" th:href="@{/css/estilos.css}"/> 
        <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    </head>

    <body>
        <!--FRAGMENTO HEADER -->
        <header th:fragment="header" class="header-medicare d-print-none">
            <nav class="navbar navbar-medicare py-3 px-4">
                <div class="container-fluid">
                    <div class="d-flex align-items-center justify-content-between w-100">

                        <!-- Logo + Marca -->
                        <span class="brand d-inline-flex align-items-center me-4">
                            <span class="brand-icon-wrapper me-2">
                                <i class="fas fa-heartbeat"></i>
                            </span>
                            <span class="brand-title">MediCare</span>
                        </span>

                        <!-- Menú de navegación -->
                        <a class="nav-link px-3" th:href="@{/}">
                            <i class="fas fa-home me-1"></i> Inicio
                        </a>
                        <a class="nav-link px-3" th:href="@{/citas}">
                            <i class="fas fa-calendar-check"></i></i> Citas Médicas
                        </a>
                        <a class="nav-link px-3" sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/usuario}">
                            <i class="fas fa-users-cog me-1"></i> Usuarios
                        </a>
                        
                        <!-- Área de usuario + Logout -->
                        <div class="d-inline-flex align-items-center ms-auto">
                            <span class="user-badge d-flex align-items-center me-3 px-3 py-1 rounded-pill">
                                <i class="fas fa-user-circle me-2"></i>
                                <strong sec:authentication="name"></strong>
                            </span>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button class="btn btn-logout btn-sm px-3 d-flex align-items-center" type="submit">
                                    <i class="fas fa-sign-out-alt"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </nav>
        </header>

        <!-- FRAGMENTO FOOTER -->
        <footer th:fragment="footer" class="footer-medicare text-center py-3 mt-auto d-print-none">
            <div class="container">
                <div class="d-flex justify-content-center align-items-center">
                    <p class="mb-2 mb-md-0 copyright-text">
                        &copy; 2026 <strong>MediCare</strong> — Todos los derechos reservados.
                    </p>
                </div>
            </div>
        </footer>
        
        <section th:fragment="mostrarToast">
            <div aria-live="polite" aria-atomic="true" 
                 class="position-fixed top-50 start-50 translate-middle" style="z-index: 1080;">                
                <div th:if="${error}" class="toast show"
                     role="alert"
                     aria-live="assertive"                     
                     aria-atomic="true"
                     data-bs-autohide="true">
                    <div class="toast-header text-white bg-danger">
                        <i class="fa-solid fa-bomb"></i> <strong clas=me-auto> [[#{error}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${error}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm" 
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
                <div th:if="${todoOk}" class="toast show"
                     role="status"
                     aria-live="polite"
                     aria-atomic="true"
                     data-bs-autohide="true">
                    <div class="toast-header text-white bg-success">
                        <i class="fa-solid fa-square-check"></i> <strong clas=me-auto> [[#{atencion}]]</strong>
                    </div>
                    <div class="toast-body">
                        <p>[[${todoOk}]]</p>
                        <div class="mt-2 pt-2 border-top text-center">
                            <button type="button" class="btn btn-secondary btn-sm" 
                                    data-bs-dismiss="toast">[[#{accion.cerrar}]]</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </body>
</html>
