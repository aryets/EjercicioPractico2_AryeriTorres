<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

    <!-- 1. Botón para abrir Modal de Agregar Usuario -->
    <section th:fragment="botonesAgregar" class="py-2 mb-3">
        <div class="container">
            <div class="row">
                <div class="col-md-3" sec:authorize="hasRole('ROLE_ADMIN')">
                    <button type="button" class="btn btn-primary btn-block" data-bs-toggle="modal" data-bs-target="#agregarUsuario">
                        <i class="fas fa-user-plus"></i> Agregar Usuario
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. Modal de Agregar Usuario -->
    <section th:fragment="agregarUsuario">
        <div id="agregarUsuario" class="modal fade" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-md">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Agregar Usuario</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="POST" class="was-validated">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" name="nombreCompleto" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" name="correo" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="claveAcceso" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" name="claveAcceso" required="true"/>
                            </div>
                            <div class="mb-3">
                                <label for="rolAsignado" class="form-label">Rol</label>
                                <select name="rolAsignado.idRol" class="form-select" required="true">
                                    <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}"></option>
                                </select>
                            </div>
                            <div class="mb-3 form-check">
                                <input class="form-check-input" type="checkbox" name="estadoActivo" id="estadoActivo" checked="true"/>
                                <label class="form-check-label" for="estadoActivo">Usuario Activo</label>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-primary" type="submit">Guardar Usuario</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <!-- 3. Tabla de Listado de Usuarios -->
    <section th:fragment="listadoUsuarios" id="usuarios">
        <div class="container">
            <div class="row">
                <div class="col-md-12">
                    <div class="card shadow-sm">
                        <div class="card-header bg-dark text-white">
                            <h4 class="mb-0">Listado de Usuarios</h4>
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>#</th>
                                        <th>Nombre</th>
                                        <th>Correo</th>
                                        <th>Rol</th>
                                        <th>Estado</th>
                                        <th sec:authorize="hasRole('ROLE_ADMIN')">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="u, contador : ${usuarios}">
                                        <td th:text="${contador.count}">1</td>
                                        <td th:text="${u.nombreCompleto}">Nombre</td>
                                        <td th:text="${u.correo}">Correo</td>
                                        <td th:text="${u.rolAsignado != null ? u.rolAsignado.nombreRol : 'Sin Rol'}">Rol</td>
                                        <td>
                                            <span th:if="${u.estadoActivo}" class="badge bg-success">Activo</span>
                                            <span th:unless="${u.estadoActivo}" class="badge bg-secondary">Inactivo</span>
                                        </td>
                                        <td sec:authorize="hasRole('ROLE_ADMIN')">
                                            <a th:href="@{/usuarios/eliminar/} + ${u.idUsuario}" class="btn btn-danger btn-sm"
                                               onclick="return confirm('¿Desea eliminar el usuario?');">
                                                <i class="fas fa-trash"></i> Eliminar
                                            </a>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(usuarios)}">
                                        <td colspan="6" class="text-center text-muted py-3">No hay usuarios registrados.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
