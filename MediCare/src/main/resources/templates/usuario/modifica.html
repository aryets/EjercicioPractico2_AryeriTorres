<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body class="d-flex flex-column min-vh-100">

        <header th:replace="~{general/fragmentos :: header}"></header>
        <nav th:replace="~{general/fragmentos :: navbar}"></nav>

        <div class="container my-4 flex-grow-1 col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-user-edit me-2"></i>Modificar Usuario</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="POST" class="was-validated">
                        <input type="hidden" th:field="*{idUsuario}"/>

                        <div class="mb-3">
                            <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" th:field="*{nombreCompleto}" required="true"/>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" th:field="*{correo}" required="true"/>
                        </div>

                        <div class="mb-3">
                            <label for="claveAcceso" class="form-label">Contraseña (dejar en blanco para conservar la actual)</label>
                            <input type="password" class="form-control" name="claveAcceso"/>
                        </div>

                        <div class="mb-3">
                            <label for="rolAsignado" class="form-label">Rol</label>
                            <select th:field="*{rolAsignado.idRol}" class="form-select" required="true">
                                <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombreRol}"></option>
                            </select>
                        </div>

                        <div class="mb-3 form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{estadoActivo}" id="estadoActivo"/>
                            <label class="form-check-label" for="estadoActivo">Usuario Activo</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/usuarios}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Regresar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
