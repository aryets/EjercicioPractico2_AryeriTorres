<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Login - MediCare</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
        <head th:replace="~{general/fragmentos :: head}"/>
    </head>
    <body>
        <div class="login-container">
            <div class="login-card">
                <div class="d-flex justify-content-center mb-3">
                    <span class="brand-icon-wrapper">
                        <i class="fas fa-heartbeat"></i>
                    </span>
                </div>
                <h3 class="login-header">MediCare - Iniciar Sesión</h3>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="text" name="username" class="form-control" placeholder="Ingrese su correo" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required/>
                    </div>
                    <button type="submit" class="btn btn-login w-100 text-white">Entrar</button>
                </form>
                <!-- Botón de Registro -->
                <a th:href="@{/registro}" class="btn btn-login w-100 text-white">
                    <i class="fas fa-user-plus me-1"></i> Registrarse
                </a>
                <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
                    ❌ Credenciales inválidas
                </div>
                <div th:if="${param.logout}" class="alert alert-success mt-3 text-center">
                    ✅ Sesión cerrada correctamente
                </div>
            </div>
        </div>
    </body>
</html>
