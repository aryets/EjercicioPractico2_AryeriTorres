<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body class="d-flex flex-column min-vh-100">

        <header th:replace="~{general/fragmentos :: header}"></header>
        <nav th:replace="~{general/fragmentos :: navbar}"></nav>

        <div class="container my-4 flex-grow-1 col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Modificar Cita Médica</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/citas/guardar}" th:object="${cita}" method="POST" class="was-validated">
                        <input type="hidden" th:field="*{idCita}"/>

                        <div class="mb-3">
                            <label for="nombrePaciente" class="form-label">Nombre del Paciente</label>
                            <input type="text" class="form-control" th:field="*{nombrePaciente}" required="true"/>
                        </div>

                        <div class="mb-3">
                            <label for="areaEspecialidad" class="form-label">Especialidad</label>
                            <input type="text" class="form-control" th:field="*{areaEspecialidad}" required="true"/>
                        </div>

                        <div class="mb-3">
                            <label for="fechaCita" class="form-label">Fecha</label>
                            <input type="date" class="form-control" th:field="*{fechaCita}" required="true"/>
                        </div>

                        <div class="mb-3">
                            <label for="precioConsulta" class="form-label">Costo (₡)</label>
                            <input type="number" step="0.01" class="form-control" th:field="*{precioConsulta}" required="true"/>
                        </div>

                        <div class="mb-3 form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{estaActiva}" id="estaActiva"/>
                            <label class="form-check-label" for="estaActiva">Cita Activa</label>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/citas}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Regresar
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer th:replace="~{general/fragmentos :: footer}"></footer>

    </body>
</html>
