<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registro - MediCare</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    </head>
    <div class="login-container">
        <div class="login-card">
            <h3 class="login-header">MediCare - Registro</h3>
            <form th:action="@{/registro}" th:object="${usuario}" method="POST">
                <!-- Nombre -->
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingrese su nombre completo" required/>
                </div>

                <!-- Correo -->
                <div class="mb-3">
                    <label class="form-label">Correo</label>
                    <input type="email" th:field="*{email}" class="form-control"  placeholder="Ingrese su correo" required/>
                    <div th:if="${error}" class="text-danger small" th:text="${error}"></div>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" class="form-control" placeholder="Ingrese su contraseña" required/>
                </div>

                <!-- Botones -->
                <button type="submit" class="btn btn-login w-100 text-white">
                    <i class="fas fa-user-plus me-2"></i>Registrarse
                </button>
                <button type="button" class="btn btn-login w-100 text-white" onclick="window.location.href='/login'">
                    Cancelar
                </button>
            </form>
        </div>
    </div>
</html>
