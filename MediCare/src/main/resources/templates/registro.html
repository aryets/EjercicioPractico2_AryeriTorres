<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Registro - MediCare</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link th:href="@{/css/estilos.css}" rel="stylesheet"/>
    </head>
    <div class="login-container">
        <div class="login-card">
            <h3 class="login-header">MediCare - Registro</h3>
            <form th:action="@{/registro}" method="post" th:object="${usuario}">
                <div class="mb-3">
                    <label class="form-label">Nombre completo</label>
                    <input type="text" th:field="*{nombreCompleto}" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email" th:field="*{correo}" class="form-control" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" th:field="*{password}" class="form-control" required/>
                </div>
                <button type="submit" class="btn btn-login w-100 text-white">Registrarse</button>
            </form>
        </div>
    </div>
</html>
