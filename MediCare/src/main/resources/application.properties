spring.application.name=MediCare

# Eliminar mensajes invasivos de spring
spring.main.banner-mode=off

# Puerto de la aplicación
server.port=78

# Configuración de Conexión a MySQL (Base de datos: medicare)
spring.datasource.url=jdbc:mysql://localhost:3306/medicare
spring.datasource.username=medicare_user
spring.datasource.password=medicare_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

